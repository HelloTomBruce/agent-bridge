name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance (a signed, verifiable link from the
      # published tarball back to this workflow run).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Re-run the full gate here rather than trusting the CI run on the
      # branch: a tag can point at a commit CI never saw.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Refuse to publish if the tag and package.json disagree — otherwise
      # `v0.3.0` can quietly ship 0.2.0 and the registry disagrees with git
      # forever (npm versions are immutable).
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
