name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Process-group teardown differs fundamentally between POSIX
        # (process.kill(-pid)) and Windows (taskkill /T), so both run.
        #
        # Caveat, stated plainly: the lifetime suites use POSIX `sh` fake
        # agents and are SKIPPED on Windows (see `posixOnly` in
        # test/invoke.test.ts). The Windows job therefore proves the package
        # builds and the platform-agnostic tests pass — it does NOT prove the
        # taskkill teardown path works. Closing that gap needs a `.cmd` fake
        # agent; tracked in docs/TIER.md.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Matches `engines.node` (>=20). Node 18 is EOL and untested, so it is
        # not claimed as supported.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      # No `version:` — the action reads `packageManager` from package.json,
      # so CI and local machines cannot drift onto different pnpm majors.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Catches a `files`/exports mistake before it reaches npm rather than
      # after: a missing dist entry only shows up at consumer install time.
      - run: pnpm pack --pack-destination "${{ runner.temp }}"
